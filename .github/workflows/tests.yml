# Run the test suite on every push and pull request, on Linux and on Windows.
# Windows runners use a legacy code page by default, so file I/O that forgets encoding="utf-8" fails here,
# not on a contributor's machine. Tests use lexical matching only; no model weights are downloaded.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU PyTorch
        # The CPU wheel avoids the multi-gigabyte CUDA build on Linux; the version matches requirements.txt.
        run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q tests/ --junitxml=junit.xml

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: junit.xml
          retention-days: 14
